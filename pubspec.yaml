name: arrival_bell
description: A location-based alarm app with a Baroque design.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  flutter_background_geolocation: ^4.16.3
  flutter_local_notifications: ^17.2.1
  just_audio: ^0.9.39
  audio_session: ^0.1.21
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_riverpod: ^2.5.1
  uuid: ^4.4.2
  geocoding: ^3.0.0
  geolocator: ^14.1.1
  permission_handler: ^11.3.1
  vibration: ^3.1.3
  google_fonts: ^6.2.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/images/pixel_station.png
    - assets/images/pixel_train.png
